# AWS PRM Resource Tagging configuration
# Copy to config/config.yaml. The local file is ignored by Git.

# Required AWS PRM tag: aws-apn-id = pc:<product_code>
partner:
  product_code: "<your-product-code>"

# Optional Partner governance tags. These are not AWS PRM requirements.
# Remove this block or use additional_tags: {} if they are not wanted.
additional_tags:
  ManagedBy: "<your-company>"
  ManagementScope: "ManagedServices"

# The example enables the services supported by V1. Keep the scope configurable
# and verify current AWS PRM eligibility before changing this list. V1 uses
# native inventory so completely untagged resources can be discovered.
allowed_services:
  - ec2
  - s3
  - rds
  - elasticloadbalancing
  - lambda
  - ecs
  - eks
  - dynamodb
  - elasticache
  - efs
  - backup
  - secretsmanager
  - sns
  - sqs
  - apigateway
  - cloudfront
  - route53

resource_types:
  ec2:
    include:
      - instance
      - volume
      - snapshot
      - vpc
      - subnet
      - internet-gateway
      - natgateway
      - elastic-ip
      - vpc-endpoint
      - transit-gateway
      - transit-gateway-attachment
  s3:
    include: [bucket]
  rds:
    include: [db, cluster]
  elasticloadbalancing:
    include: [loadbalancer, classic-loadbalancer]
  lambda:
    include: [function]
  ecs:
    include: [cluster, service]
  eks:
    include: [cluster]
  dynamodb:
    include: [table]
  elasticache:
    include: [cluster]
  efs:
    include: [file-system]
  backup:
    include: [backup-vault]
  secretsmanager:
    include: [secret]
  sns:
    include: [topic]
  sqs:
    include: [queue]
  apigateway:
    include: [restapis]
  cloudfront:
    include: [distribution]
  route53:
    include: [hostedzone]

# Empty means all enabled/opted-in Regions returned by EC2 DescribeRegions.
# Set an explicit list to reduce scope. exclude_regions applies only when this
# list is empty.
include_regions: []
exclude_regions: []

# Optional filter for services using the generic Tagging API provider. Native
# V1 providers ignore this filter so their inventory remains complete.
filter_tags: {}

reports_dir: "reports"

organization:
  # bootstrap.sh uses these values when it creates/updates the service-managed
  # PRM-Resource-Tagging StackSet from the Organizations management account.
  role_name: "PRM-TaggingRole"
  # This value is not a password, but use a distinct value for each Organization.
  # It must remain identical here and in the StackSet parameters.
  external_id: "PRMTaggingAutomation"
  exclude_accounts: []
