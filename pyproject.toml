[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-prm-tagger"
version = "1.0.0"
description = "Discover, audit and apply AWS Partner Revenue Measurement (PRM) resource tags across AWS accounts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "moto[all]>=5.0",
    "ruff>=0.4",
]

[project.scripts]
prm-tagger = "bs4it_tagging.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
